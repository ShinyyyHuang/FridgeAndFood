<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冰箱 &amp; 食谱</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --line:#e6eaee; --text:#1f2937; --muted:#8b95a1;
  --green:#10b981; --green-dark:#059669; --red:#ef4444; --radius:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; -webkit-text-size-adjust:100%;
}
/* ---------- 顶部 ---------- */
.head-wrap{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;}
.brand{font-size:16px;font-weight:700;white-space:nowrap;}
.top-actions{display:flex;gap:6px;flex-wrap:wrap;}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;
     cursor:pointer;color:var(--text);font-family:inherit;transition:.15s;white-space:nowrap;}
.btn:hover{background:#f3f6f8;}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;}
.btn.primary:hover{background:var(--green-dark);}
.tabs{display:flex;gap:4px;padding:0 12px;}
.tab{border:none;background:transparent;padding:10px 16px;font-size:14px;font-family:inherit;
     color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;font-weight:600;}
.tab.active{color:var(--green-dark);border-bottom-color:var(--green);}
/* ---------- 面板 ---------- */
main{padding:14px 16px 80px;max-width:1100px;margin:0 auto;}
.panel{display:none;}
.panel.active{display:block;}
.zone-block{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 6px;margin-bottom:16px;}
.zone-block h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:6px;}
.zone-block h3 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:700px;}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);font-weight:400;}
th{font-size:12px;color:var(--muted);background:#fafbfc;white-space:nowrap;position:sticky;top:0;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fafcfb;}
td input{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;
         padding:5px 6px;font:inherit;color:inherit;}
td input:hover{border-color:#e9edf1;background:#fafbfc;}
td input:focus{outline:none;border-color:var(--green);background:#fff;}
td input[type=date]{min-width:132px;}
td input.input-portions{max-width:64px;text-align:center;}
tr.expired{background:#fff6f6;}
tr.expired:hover{background:#ffeded;}
tr.expired td input[data-field=expireDate]{color:var(--red);font-weight:700;}
.empty-row{color:var(--muted);font-size:13px;text-align:center;padding:18px 0 !important;}
.row-del{border:none;background:transparent;color:#cbd5e1;font-size:18px;cursor:pointer;
         line-height:1;padding:2px 7px;border-radius:6px;}
.row-del:hover{background:#fee2e2;color:var(--red);}
.btn-add{border:1px solid var(--green);background:#fff;color:var(--green-dark);border-radius:8px;
         padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;}
.btn-add:hover{background:var(--green);color:#fff;}
/* ---------- 食材池 ---------- */
.pantry-bar{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;}
.pantry-title{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.pantry-title small{font-weight:400;color:var(--muted);font-size:11.5px;}
.pantry-items{display:flex;flex-wrap:wrap;gap:7px;min-height:32px;align-items:center;}
.pantry-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  background:#fff;border:1px solid #d7dee5;font-size:13px;cursor:pointer;user-select:none;transition:.12s;}
.pantry-chip:hover{border-color:var(--green);box-shadow:0 2px 6px rgba(16,185,129,.15);}
.pantry-chip.selected{background:var(--green);color:#fff;border-color:var(--green);}
.pantry-chip em{font-style:normal;font-size:11px;color:#9ca3af;}
.pantry-chip em.exp{color:var(--red);font-weight:700;}
.pantry-chip em.part{color:#94a3b8;font-weight:600;}
.pantry-chip.selected em{color:rgba(255,255,255,.88);}
.pantry-chip.selected em.exp{color:#fff;}
.empty-hint{color:var(--muted);font-size:12.5px;}
/* ---------- 日卡片 ---------- */
.day-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:14px;}
.day-head{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:10px;border-bottom:1px dashed var(--line);}
.day-date{font-weight:700;font-size:15px;}
.day-week{color:var(--muted);font-size:13px;}
.day-today{background:#dcfce7;color:#15803d;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700;}
.meal-grid-head{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr);gap:8px;
  font-size:11px;color:var(--muted);padding-bottom:4px;}
.meal-row{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start;margin-bottom:8px;}
.meal-label{font-size:13px;font-weight:600;color:#475569;padding-top:9px;white-space:nowrap;}
.dropzone{min-height:40px;border:1.5px dashed #cbd5e1;border-radius:10px;padding:5px;
  display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;background:#fafbfc;transition:.15s;cursor:pointer;}
.dropzone.over{border-color:var(--green);background:#ecfdf5;}
.dz-hint{font-size:11.5px;color:#b6c0cb;padding:8px 4px;pointer-events:none;}
.actual{min-height:40px;border-radius:10px;background:#f8fafc;border:1px solid #eef2f6;padding:5px;
  display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;}
.actual-empty{font-size:11.5px;color:#c8d1da;padding:8px 4px;}
.chip{display:inline-flex;align-items:center;gap:4px;background:#eef2ff;color:#3730a3;
  border-radius:999px;padding:3px 5px 3px 7px;font-size:12.5px;line-height:1.35;max-width:100%;}
.chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip.done{background:#dcfce7;color:#166534;text-decoration:line-through;}
.chip input[type=checkbox]{margin:0;accent-color:#22c55e;width:14px;height:14px;cursor:pointer;flex:none;}
.chip-x{border:none;background:transparent;color:inherit;opacity:.45;cursor:pointer;
  font-size:15px;line-height:1;padding:0 3px;}
.chip-x:hover{opacity:1;}
.actual-chip{background:#d1fae5;color:#065f46;padding:3px 9px;}
/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal[hidden]{display:none;}
.modal-mask{position:absolute;inset:0;background:rgba(15,23,42,.45);}
.modal-box{position:relative;background:#fff;border-radius:16px;padding:20px;max-width:480px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.2);max-height:88vh;overflow:auto;}
.modal-box h3{margin:0 0 10px;font-size:16px;}
.modal-desc{font-size:12.5px;color:var(--muted);line-height:1.7;margin:0 0 14px;}
.modal-label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;}
.modal-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  font:inherit;font-size:13px;margin-bottom:12px;}
.modal-input:focus{outline:none;border-color:var(--green);}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.modal-status{font-size:12.5px;color:var(--muted);min-height:18px;margin:0 0 12px;word-break:break-all;}
/* ---------- 移动端 ---------- */
@media (max-width:620px){
  main{padding:10px 10px 80px;}
  .topbar{padding:8px 10px;}
  .brand{font-size:14px;}
  .btn{padding:5px 9px;font-size:12px;}
  .tab{padding:9px 10px;font-size:13px;}
  .meal-grid-head,.meal-row{grid-template-columns:56px minmax(0,1fr) minmax(0,1fr);gap:6px;}
  .meal-label{font-size:12px;padding-top:10px;}
  .chip{font-size:11.5px;}
}
</style>
</head>
<body>

<div class="head-wrap">
  <header class="topbar">
    <div class="brand">🧊 冰箱 &amp; 食谱</div>
    <div class="top-actions">
      <button class="btn" id="btnCloud">☁️ 云同步</button>
      <button class="btn" id="btnExport">导出</button>
      <button class="btn" id="btnImport">导入</button>
      <input type="file" id="fileInput" accept="application/json,.json" hidden>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="fridge">冰箱里有什么</button>
    <button class="tab" data-tab="meals">后几天食谱</button>
  </nav>
</div>

<main>
  <!-- ============ Tab 1 ============ -->
  <section id="tab-fridge" class="panel active">

    <div class="zone-block">
      <h3>🧊 冷藏 <small id="count-cold"></small></h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>食品名称</th><th>份数</th><th>购买日期</th><th>大概过期日期</th><th>食用日期</th><th style="width:44px"></th>
            </tr>
          </thead>
          <tbody id="body-cold"></tbody>
          <tfoot>
            <tr>
              <td><input id="add-name-cold" placeholder="＋ 添加食品名称"></td>
              <td><input type="number" min="1" step="1" value="1" id="add-portion-cold" class="input-portions"></td>
              <td><input type="date" id="add-buy-cold"></td>
              <td><input type="date" id="add-exp-cold"></td>
              <td></td>
              <td><button class="btn-add" data-zone="cold">添加</button></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <div class="zone-block">
      <h3>❄️ 冷冻 <small id="count-frozen"></small></h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>食品名称</th><th>份数</th><th>购买日期</th><th>大概过期日期</th><th>食用日期</th><th style="width:44px"></th>
            </tr>
          </thead>
          <tbody id="body-frozen"></tbody>
          <tfoot>
            <tr>
              <td><input id="add-name-frozen" placeholder="＋ 添加食品名称"></td>
              <td><input type="number" min="1" step="1" value="1" id="add-portion-frozen" class="input-portions"></td>
              <td><input type="date" id="add-buy-frozen"></td>
              <td><input type="date" id="add-exp-frozen"></td>
              <td></td>
              <td><button class="btn-add" data-zone="frozen">添加</button></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

  </section>

  <!-- ============ Tab 2 ============ -->
  <section id="tab-meals" class="panel">
    <div class="pantry-bar">
      <div class="pantry-title">
        🥬 可用食材
        <small>（点击选中后点计划栏，或直接拖拽到计划栏；勾选即为实际吃掉一份）</small>
      </div>
      <div class="pantry-items" id="pantryItems"></div>
    </div>
    <div id="days"></div>
  </section>
</main>

<!-- ============ 云同步弹窗 ============ -->
<div class="modal" id="cloudModal" hidden>
  <div class="modal-mask"></div>
  <div class="modal-box">
    <h3>☁️ 云同步</h3>
    <p class="modal-desc">
      数据默认保存在本机浏览器。想在手机 / 电脑之间同步：<br>
      ① 在 A 设备点「创建云端备份」→ 得到一串同步码；<br>
      ② 在 B 设备把同步码填进下面输入框 → 点「读取云端」。<br>
      之后每次修改都会自动上传。
    </p>
    <label class="modal-label">同步码</label>
    <input id="cloudIdInput" class="modal-input" placeholder="粘贴同步码">
    <div class="modal-actions">
      <button class="btn primary" id="btnCreateCloud">创建云端备份</button>
      <button class="btn" id="btnPullCloud">读取云端</button>
      <button class="btn" id="btnPushCloud">上传云端</button>
    </div>
    <p class="modal-status" id="cloudStatus"></p>
    <div class="modal-actions" style="margin-bottom:0">
      <button class="btn" id="btnCloseModal" style="margin-left:auto">关闭</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   常量与工具
   ========================================================= */
const STORAGE_KEY = 'fridge-meal-state-v1';
const CLOUD_KEY   = 'fridge-meal-cloud-id';

const MEALS = [
  { key:'breakfast', label:'早餐', icon:'🌅' },
  { key:'lunch',     label:'午餐', icon:'☀️' },
  { key:'dinner',    label:'晚餐', icon:'🌙' },
  { key:'snack',     label:'零食', icon:'🍪' },
];

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function fmtDate(d){
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return fmtDate(new Date()); }
function parseDate(s){
  const [y,m,d] = String(s).split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDays(dateStr, n){
  const d = parseDate(dateStr);
  d.setDate(d.getDate() + n);
  return fmtDate(d);
}
function isExpired(item){
  return !!item.expireDate && item.expireDate < todayStr();
}
/* 食用日期后 2 天隐藏该行（多份食材只有最后一份吃完才写食用日期） */
function isHidden(item){
  if (!item.eatDate) return false;
  return todayStr() > addDays(item.eatDate, 2);
}
/* 过期日期近的在前（过期的自然排最前） */
function sortItems(a, b){
  const ea = a.expireDate || '9999-12-31';
  const eb = b.expireDate || '9999-12-31';
  if (ea !== eb) return ea < eb ? -1 : 1;
  return String(a.name || '').localeCompare(String(b.name || ''), 'zh');
}

/* =========================================================
   状态
   ========================================================= */
let state = loadLocal();
let cloudId = localStorage.getItem(CLOUD_KEY) || '';
let selectedFridgeId = null;
let pushTimer = null;

function normalize(s){
  s = (s && typeof s === 'object') ? s : {};
  s.fridge = Array.isArray(s.fridge) ? s.fridge : [];
  s.meals  = (s.meals && typeof s.meals === 'object') ? s.meals : {};
  s.fridge.forEach(it => {
    it.id   = it.id || uid();
    it.zone = it.zone === 'frozen' ? 'frozen' : 'cold';
    it.name = it.name || '';
    /* 兼容旧数据：没有份数字段的，默认 1 份 */
    let p = parseInt(it.portions, 10);
    it.portions = (Number.isFinite(p) && p >= 1) ? p : 1;
    it.buyDate = it.buyDate || '';
    it.expireDate = it.expireDate || '';
    it.eatDate = it.eatDate || '';
  });
  return s;
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  }catch(e){ console.warn('读取本地数据失败', e); }
  return normalize({});
}

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('保存失败', e); }
  scheduleCloudPush();
}

function ensureMeal(date, mealKey){
  if (!state.meals[date]) state.meals[date] = {};
  if (!state.meals[date][mealKey]) state.meals[date][mealKey] = { plan: [] };
  if (!Array.isArray(state.meals[date][mealKey].plan)) state.meals[date][mealKey].plan = [];
  return state.meals[date][mealKey];
}
function readMeal(date, mealKey){
  const d = state.meals[date];
  if (!d || !d[mealKey] || !Array.isArray(d[mealKey].plan)) return { plan: [] };
  return d[mealKey];
}

/* =========================================================
   份数计算
   ========================================================= */

/* 统计某个食材在所有日期 / 餐次里已被勾选（实际吃掉）的次数 */
function usedCount(fridgeId){
  let n = 0;
  for (const date in state.meals){
    const day = state.meals[date];
    if (!day) continue;
    for (const k in day){
      const plan = day[k] && day[k].plan;
      if (!Array.isArray(plan)) continue;
      for (const p of plan){
        if (p.done && p.fridgeId === fridgeId) n++;
      }
    }
  }
  return n;
}

/* 该食材还剩几份 */
function remainingPortions(item){
  const total = Math.max(1, Number(item.portions) || 1);
  return Math.max(0, total - usedCount(item.id));
}

/* 根据勾选情况，重算所有食材的「食用日期」
   —— 吃满份数时才写入，取第 N 份（最后一份）被吃的那天 */
function syncEatDates(){
  const doneMap = {};   // fridgeId -> [{date, id}]
  for (const date in state.meals){
    const day = state.meals[date];
    if (!day) continue;
    for (const k in day){
      const plan = day[k] && day[k].plan;
      if (!Array.isArray(plan)) continue;
      for (const p of plan){
        if (!p.done) continue;
        if (!doneMap[p.fridgeId]) doneMap[p.fridgeId] = [];
        doneMap[p.fridgeId].push({ date: date, id: p.id });
      }
    }
  }

  state.fridge.forEach(item => {
    const total = Math.max(1, Number(item.portions) || 1);
    const list = (doneMap[item.id] || []).slice()
      .sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));

    if (list.length >= total){
      item.eatDate = list[total - 1].date;   // 最后一份的日期
    } else {
      item.eatDate = '';                     // 还没吃完，不写食用日期
    }
  });
}

/* =========================================================
   渲染：冰箱
   ========================================================= */
function renderFridge(){
  ['cold','frozen'].forEach(zone => {
    const tbody = document.getElementById('body-' + zone);
    const all   = state.fridge.filter(f => f.zone === zone);
    const items = all.filter(f => !isHidden(f)).sort(sortItems);

    const cntEl = document.getElementById('count-' + zone);
    if (cntEl) cntEl.textContent = items.length ? items.length + ' 项' : '';

    if (!items.length){
      tbody.innerHTML = '<tr><td colspan="6" class="empty-row">还没有记录，在下面一行添加吧</td></tr>';
      return;
    }

    tbody.innerHTML = items.map(it => {
      const expired = isExpired(it);
      const total = Math.max(1, Number(it.portions) || 1);
      const left  = remainingPortions(it);
      const tip   = it.eatDate ? '' : `已用 ${total - left}/${total} 份`;
      return `<tr data-id="${it.id}" class="${expired ? 'expired' : ''}">
        <td><input data-field="name" value="${esc(it.name)}" placeholder="食品名称"></td>
        <td><input type="number" min="1" step="1" class="input-portions"
                   data-field="portions" value="${total}" title="${esc(tip)}"></td>
        <td><input type="date" data-field="buyDate" value="${it.buyDate || ''}"></td>
        <td><input type="date" data-field="expireDate" value="${it.expireDate || ''}"></td>
        <td><input type="date" data-field="eatDate" value="${it.eatDate || ''}"></td>
        <td><button class="row-del" data-del="${it.id}" title="删除">×</button></td>
      </tr>`;
    }).join('');
  });
}

function restoreFocus(f){
  if (!f) return;
  const tr = document.querySelector('#tab-fridge tr[data-id="' + f.id + '"]');
  if (!tr) return;
  const inp = tr.querySelector('input[data-field="' + f.field + '"]');
  if (inp) inp.focus();
}

/* =========================================================
   渲染：食材池
   ========================================================= */
function renderPantry(){
  const wrap  = document.getElementById('pantryItems');
  /* 还有剩余份数、且没被隐藏的，才算可用食材 */
  const items = state.fridge
    .filter(f => !isHidden(f) && remainingPortions(f) > 0)
    .sort(sortItems);

  if (selectedFridgeId && !items.some(i => i.id === selectedFridgeId)) selectedFridgeId = null;

  if (!items.length){
    wrap.innerHTML = '<span class="empty-hint">暂无可用食材，去「冰箱里有什么」添加吧</span>';
    return;
  }

  wrap.innerHTML = items.map(it => {
    const exp = isExpired(it);
    const left = remainingPortions(it);
    return `<span class="pantry-chip ${selectedFridgeId === it.id ? 'selected' : ''}"
              draggable="true" data-fridge-id="${it.id}"
              title="${esc(it.name || '未命名')}　剩余 ${left} 份">
      ${esc(it.name || '未命名')}
      <em class="part">剩${left}份</em>
      ${it.expireDate ? `<em class="${exp ? 'exp' : ''}">${esc(it.expireDate.slice(5))}</em>` : ''}
    </span>`;
  }).join('');
}

/* =========================================================
   渲染：7 天食谱
   ========================================================= */
function chipHTML(p, date, mealKey){
  return `<span class="chip ${p.done ? 'done' : ''}" data-plan-id="${p.id}">
    <input type="checkbox" ${p.done ? 'checked' : ''}
           data-toggle="${p.id}" data-date="${date}" data-meal="${mealKey}">
    <span class="chip-name">${esc(p.name)}</span>
    <button class="chip-x" data-remove="${p.id}" data-date="${date}" data-meal="${mealKey}" title="移除">×</button>
  </span>`;
}

function renderDays(){
  const wrap  = document.getElementById('days');
  const today = todayStr();
  let html = '';

  for (let i = 0; i < 7; i++){
    const date = addDays(today, i);
    const d    = parseDate(date);
    const week = '日一二三四五六'[d.getDay()];

    html += `<div class="day-card">
      <div class="day-head">
        <span class="day-date">${d.getMonth()+1} 月 ${d.getDate()} 日</span>
        <span class="day-week">星期${week}</span>
        ${i === 0 ? '<span class="day-today">今天</span>' : ''}
      </div>
      <div class="meal-grid-head"><span></span><span>计划</span><span>实际</span></div>`;

    for (const m of MEALS){
      const meal  = readMeal(date, m.key);
      const chips = meal.plan.map(p => chipHTML(p, date, m.key)).join('');
      const done  = meal.plan.filter(p => p.done);

      html += `<div class="meal-row">
        <div class="meal-label">${m.icon}${m.label}</div>
        <div class="dropzone" data-drop="plan" data-date="${date}" data-meal="${m.key}">
          ${chips}${meal.plan.length ? '' : '<span class="dz-hint">拖入 / 点选食材</span>'}
        </div>
        <div class="actual">
          ${done.length
            ? done.map(p => `<span class="chip actual-chip">${esc(p.name)}</span>`).join('')
            : '<span class="actual-empty">—</span>'}
        </div>
      </div>`;
    }
    html += '</div>';
  }
  wrap.innerHTML = html;
}

function renderAll(){
  renderFridge();
  renderPantry();
  renderDays();
}

/* =========================================================
   冰箱交互
   ========================================================= */
const fridgePanel = document.getElementById('tab-fridge');

fridgePanel.addEventListener('click', e => {
  const addBtn = e.target.closest('.btn-add');
  if (addBtn){ handleAdd(addBtn.dataset.zone); return; }

  const delBtn = e.target.closest('[data-del]');
  if (delBtn){
    if (!confirm('确定删除这条记录吗？')) return;
    state.fridge = state.fridge.filter(f => f.id !== delBtn.dataset.del);
    save();
    renderAll();
  }
});

fridgePanel.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest('tfoot')){
    const zone = e.target.id.split('-').pop();
    handleAdd(zone);
  }
});

fridgePanel.addEventListener('change', e => {
  const inp = e.target.closest('input[data-field]');
  if (!inp) return;
  const tr = inp.closest('tr');
  if (!tr || !tr.dataset.id) return;
  const item = state.fridge.find(f => f.id === tr.dataset.id);
  if (!item) return;

  const field = inp.dataset.field;

  if (field === 'portions'){
    let v = parseInt(inp.value, 10);
    if (!Number.isFinite(v) || v < 1) v = 1;
    item.portions = v;
    inp.value = v;
    syncEatDates();          // 改份数可能影响“吃满没吃满”
  } else {
    item[field] = inp.value;
  }

  save();

  const focus = { id: tr.dataset.id, field: field };
  renderFridge();
  restoreFocus(focus);
  renderPantry();
  renderDays();
});

function handleAdd(zone){
  const nameEl = document.getElementById('add-name-' + zone);
  const name   = nameEl.value.trim();
  if (!name){ alert('请填写食品名称'); nameEl.focus(); return; }

  const portionEl = document.getElementById('add-portion-' + zone);
  let portions = parseInt(portionEl.value, 10);
  if (!Number.isFinite(portions) || portions < 1) portions = 1;

  state.fridge.push({
    id: uid(),
    zone: zone,
    name: name,
    portions: portions,
    buyDate:    document.getElementById('add-buy-' + zone).value,
    expireDate: document.getElementById('add-exp-' + zone).value,
    eatDate: ''
  });
  save();

  nameEl.value = '';
  portionEl.value = 1;
  document.getElementById('add-buy-' + zone).value = '';
  document.getElementById('add-exp-' + zone).value = '';
  nameEl.focus();
  renderAll();
}

/* =========================================================
   食谱交互
   ========================================================= */
const mealsPanel = document.getElementById('tab-meals');

mealsPanel.addEventListener('change', e => {
  const cb = e.target.closest('input[data-toggle]');
  if (!cb) return;
  togglePlan(cb.dataset.date, cb.dataset.meal, cb.dataset.toggle, cb.checked);
});

mealsPanel.addEventListener('click', e => {
  const x = e.target.closest('[data-remove]');
  if (x){
    removePlanItem(x.dataset.date, x.dataset.meal, x.dataset.remove);
    return;
  }
  if (e.target.closest('.chip')) return;

  const dz = e.target.closest('.dropzone');
  if (dz && selectedFridgeId){
    addIngredientToPlan(selectedFridgeId, dz.dataset.date, dz.dataset.meal);
    selectedFridgeId = null;
    renderPantry();
  }
});

document.getElementById('pantryItems').addEventListener('click', e => {
  const chip = e.target.closest('.pantry-chip');
  if (!chip) return;
  const id = chip.dataset.fridgeId;
  selectedFridgeId = (selectedFridgeId === id) ? null : id;
  renderPantry();
});

/* --------- 拖拽 --------- */
document.addEventListener('dragstart', e => {
  const chip = e.target.closest('.pantry-chip');
  if (!chip) return;
  e.dataTransfer.setData('text/plain', chip.dataset.fridgeId);
  e.dataTransfer.effectAllowed = 'copy';
  chip.style.opacity = '.4';
});
document.addEventListener('dragend', e => {
  document.querySelectorAll('.pantry-chip').forEach(c => c.style.opacity = '');
  document.querySelectorAll('.dropzone.over').forEach(d => d.classList.remove('over'));
});
document.addEventListener('dragover', e => {
  const dz = e.target.closest('.dropzone');
  if (!dz) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  document.querySelectorAll('.dropzone.over').forEach(d => { if (d !== dz) d.classList.remove('over'); });
  dz.classList.add('over');
});
document.addEventListener('drop', e => {
  const dz = e.target.closest('.dropzone');
  if (!dz) return;
  e.preventDefault();
  dz.classList.remove('over');
  const fid = e.dataTransfer.getData('text/plain');
  if (fid) addIngredientToPlan(fid, dz.dataset.date, dz.dataset.meal);
});

/* --------- 业务动作 --------- */
function addIngredientToPlan(fridgeId, date, mealKey){
  const item = state.fridge.find(f => f.id === fridgeId);
  if (!item) return;

  if (remainingPortions(item) <= 0){
    alert('「' + (item.name || '该食材') + '」的份数已经用完啦');
    return;
  }

  const meal = ensureMeal(date, mealKey);
  if (meal.plan.some(p => p.fridgeId === fridgeId)) return; // 同一餐不重复

  meal.plan.push({
    id: uid(),
    fridgeId: fridgeId,
    name: item.name || '未命名',
    done: false
  });
  save();
  renderAll();
}

function removePlanItem(date, mealKey, planId){
  const meal = ensureMeal(date, mealKey);
  const idx  = meal.plan.findIndex(p => p.id === planId);
  if (idx < 0) return;
  meal.plan.splice(idx, 1);
  syncEatDates();          // 移除后重新计算份数与食用日期
  save();
  renderAll();
}

function togglePlan(date, mealKey, planId, checked){
  const meal = ensureMeal(date, mealKey);
  const p = meal.plan.find(x => x.id === planId);
  if (!p) return;

  if (checked){
    const item = state.fridge.find(f => f.id === p.fridgeId);
    if (item && remainingPortions(item) <= 0){
      alert('「' + (item.name || '该食材') + '」的份数已经用完，不能再勾选');
      renderAll();
      return;
    }
  }

  p.done = checked;
  syncEatDates();          // 吃满份数 → 写入最后一份的日期
  save();
  renderAll();
}

/* =========================================================
   Tab 切换
   ========================================================= */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    document.querySelectorAll('.panel').forEach(p =>
      p.classList.toggle('active', p.id === 'tab-' + t.dataset.tab));
  });
});

/* =========================================================
   导入 / 导出
   ========================================================= */
document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '冰箱食谱-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
});

document.getElementById('btnImport').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      state = normalize(data);
      syncEatDates();
      save();
      renderAll();
      alert('导入成功 ✅');
    }catch(err){
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* =========================================================
   云同步
   ========================================================= */
const API = 'https://jsonblob.com/api/jsonBlob';

function setCloudStatus(msg){
  const el = document.getElementById('cloudStatus');
  if (el) el.textContent = msg;
}

function scheduleCloudPush(){
  if (!cloudId) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushCloud(true), 1500);
}

async function pushCloud(silent){
  if (!cloudId) return;
  if (!silent) setCloudStatus('上传中…');
  try{
    const res = await fetch(API + '/' + cloudId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(state)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (!silent) setCloudStatus('✅ 已上传 ' + new Date().toLocaleTimeString());
    else setCloudStatus('✅ 已自动同步');
  }catch(err){
    setCloudStatus('❌ 上传失败：' + err.message);
  }
}

async function pullCloud(){
  if (!cloudId){ setCloudStatus('请先填写同步码'); return; }
  if (!confirm('从云端读取会覆盖本机当前数据，确定继续吗？')) return;
  setCloudStatus('读取中…');
  try{
    const res = await fetch(API + '/' + cloudId, {
      headers: { 'Accept': 'application/json' },
      cache: 'no-store'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state = normalize(data);
    syncEatDates();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    renderAll();
    setCloudStatus('✅ 已从云端读取');
  }catch(err){
    setCloudStatus('❌ 读取失败：' + err.message);
  }
}

async function createCloud(){
  if (!confirm('创建一个新的云端备份？（当前数据会上传）')) return;
  setCloudStatus('创建中…');
  try{
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(state)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const loc = res.headers.get('Location') || res.headers.get('X-jsonblob');
    if (!loc) throw new Error('服务未返回同步码，请改用「导出 / 导入」');
    const id = loc.split('/').filter(Boolean).pop();

    cloudId = id;
    localStorage.setItem(CLOUD_KEY, id);
    document.getElementById('cloudIdInput').value = id;
    setCloudStatus('✅ 创建成功！同步码：' + id + '（复制到其他设备填入即可）');
  }catch(err){
    setCloudStatus('❌ ' + err.message);
  }
}

document.getElementById('btnCloud').addEventListener('click', () => {
  document.getElementById('cloudIdInput').value = cloudId;
  setCloudStatus(cloudId ? '当前同步码：' + cloudId : '尚未创建云端备份');
  document.getElementById('cloudModal').hidden = false;
});
document.getElementById('btnCloseModal').addEventListener('click', () => {
  document.getElementById('cloudModal').hidden = true;
});
document.querySelector('#cloudModal .modal-mask').addEventListener('click', () => {
  document.getElementById('cloudModal').hidden = true;
});
document.getElementById('cloudIdInput').addEventListener('input', e => {
  const v = e.target.value.trim();
  cloudId = v;
  if (v) localStorage.setItem(CLOUD_KEY, v);
  else localStorage.removeItem(CLOUD_KEY);
});
document.getElementById('btnCreateCloud').addEventListener('click', createCloud);
document.getElementById('btnPullCloud').addEventListener('click', pullCloud);
document.getElementById('btnPushCloud').addEventListener('click', () => pushCloud(false));

/* =========================================================
   启动
   ========================================================= */
syncEatDates();   // 首次加载时校正一次食用日期
renderAll();

/* 跨天自动刷新（过期状态 / 隐藏规则 / 日期列表） */
let lastToday = todayStr();
setInterval(() => {
  const t = todayStr();
  if (t !== lastToday){
    lastToday = t;
    syncEatDates();
    renderAll();
  }
}, 60000);

/* 多标签页同步 */
window.addEventListener('storage', e => {
  if (e.key === STORAGE_KEY && e.newValue){
    try{
      state = normalize(JSON.parse(e.newValue));
      syncEatDates();
      renderAll();
    }catch(_){}
  }
});
</script>
